<script>
const llForm = { name:'', location:'', contact:'', message:'' };
function llSetField(k,v){ llForm[k]=v; const map={name:'Name',location:'Location',contact:'Contact',message:'Message'}; const e=document.getElementById('err-'+map[k]); if(e){e.hidden=true;e.textContent='';} }
function llValidate(){
  const errors={};
  if(!llForm.name.trim()) errors.name='Please enter your name.';
  if(!llForm.location.trim()) errors.location='Where would your store be?';
  const digits=(llForm.contact.match(/\d/g)||[]).length;
  if(!llForm.contact.trim()) errors.contact='A contact number helps us reach you.';
  else if(digits<7) errors.contact="That doesn't look like a full number.";
  return errors;
}
function llSubmitForm(e){
  e.preventDefault();
  llForm.name=document.getElementById('field-name')?.value||'';
  llForm.location=document.getElementById('field-location')?.value||'';
  llForm.contact=document.getElementById('field-contact')?.value||'';
  llForm.message=document.getElementById('field-message')?.value||'';
  const errors=llValidate();
  ['Name','Location','Contact'].forEach(k=>{
    const el=document.getElementById('err-'+k);
    const key=k.toLowerCase();
    if(el){ if(errors[key]){el.hidden=false;el.textContent=errors[key];} else {el.hidden=true;} }
  });
  if(Object.keys(errors).length) return false;
  document.getElementById('successName').textContent=llForm.name.trim().split(' ')[0];
  document.getElementById('formWrap').hidden=true;
  document.getElementById('formSuccess').hidden=false;
  return false;
}
(function(){
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const toggle=document.getElementById('llNavToggle');
  const menu=document.getElementById('llNavMenu');
  const links=document.getElementById('llNavLinks');
  const closeNav=()=>{ if(toggle){toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open menu');} menu?.classList.remove('is-open'); links?.classList.remove('is-open'); };
  toggle?.addEventListener('click',()=>{ const open=toggle.getAttribute('aria-expanded')!=='true'; toggle.setAttribute('aria-expanded',open?'true':'false'); toggle.setAttribute('aria-label',open?'Close menu':'Open menu'); menu?.classList.toggle('is-open',open); links?.classList.toggle('is-open',open); });
  links?.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeNav));
  const io=new IntersectionObserver((entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ const el=en.target; const d=parseInt(el.getAttribute('data-reveal-delay')||'0',10); el.style.transitionDelay=d+'ms'; el.style.opacity='1'; el.style.transform='none'; io.unobserve(el);} }); },{threshold:0.12,rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('[data-reveal]').forEach(el=>{ if(!reducedMotion){ el.style.opacity='0'; el.style.transform='translateY(30px)'; el.style.transition='opacity .85s cubic-bezier(.16,1,.3,1), transform .85s cubic-bezier(.16,1,.3,1)'; } io.observe(el); });
  const setupLoop=(aId,bId)=>{ const a=document.getElementById(aId),b=document.getElementById(bId); if(!a||!b)return; const FADE=1.2; let active=a,idle=b; [a,b].forEach(v=>{v.muted=true;v.playsInline=true;v.play().catch(()=>{});}); b.pause(); b.currentTime=0; const tick=()=>{ if(!active.duration||isNaN(active.duration))return; if(active.currentTime>=active.duration-FADE){ idle.currentTime=0; idle.play().catch(()=>{}); idle.style.opacity='1'; active.style.opacity='0'; const prev=active; active=idle; idle=prev; setTimeout(()=>prev.pause(),FADE*1000);} }; a.addEventListener('timeupdate',tick); b.addEventListener('timeupdate',tick); };
  setupLoop('heroVidA','heroVidB'); setupLoop('closeVidA','closeVidB');
  const nav=document.getElementById('lnav'); const hero=document.getElementById('heroParallax');
  const onScroll=()=>{ const y=window.scrollY||window.pageYOffset; if(nav){ const solid=y>40; nav.style.background=solid?'rgba(255,255,255,.9)':'transparent'; nav.style.backdropFilter=solid?'saturate(180%) blur(14px)':'none'; nav.style.webkitBackdropFilter=solid?'saturate(180%) blur(14px)':'none'; nav.style.boxShadow=solid?'0 6px 26px rgba(26,26,26,.08)':'none'; nav.style.borderBottomColor=solid?'rgba(26,26,26,.06)':'transparent'; } if(hero&&!reducedMotion&&y<1100) hero.style.transform='translateY('+(y*0.16)+'px) scale(1.06)'; };
  onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
})();
</script>
